name: Combat CI

on:
  push:
    branches: ["feat/combat-powerups"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format combat files
        run: bunx prettier --write src/game/*.ts src/routes/index.tsx
      - name: Commit formatting
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game src/routes/index.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: apply prettier formatting [skip ci]"
            git push origin HEAD:feat/combat-powerups
          fi
      - run: npm test
      - run: npm run lint
      - run: npm run build
